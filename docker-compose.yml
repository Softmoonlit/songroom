name: songroom

services:
  songroom:
    image: ${APP_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/ghcr.io/softmoonlit/songroom:latest}
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - SONGROOM_CONFIG=/etc/songroom/config.json
      - TMPDIR=/tmp/songroom
    volumes:
      - /etc/songroom/config.json:/etc/songroom/config.json:ro
      - /var/lib/songroom/data:/var/lib/songroom/data:rw
      - /var/lib/songroom/private:/var/lib/songroom/private:ro
    tmpfs:
      - /tmp/songroom:mode=0700,uid=997,gid=997
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000/healthz\").then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
